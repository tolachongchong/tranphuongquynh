<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cả một vườn thương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>

<header>
  <h1>Gửi <span class="to"></span>, cả một vườn thương.</h1>
  <p>Chúc mừng ngày 20/10</p>
</header>

<button id="open" class="cta">💌 Ấn vào đây để xem thiệp chúc</button>
<main id="garden" aria-label="Vườn hoa, chạm vào hoa để hoa rung"></main>

<nav class="bar">
  <button id="again">Đọc lại thiệp</button>
  <button id="bloom">Cho hoa nở lại</button>
</nav>
<button id="mute" class="mute off" aria-label="Bật hoặc tắt nhạc">♪</button>

<section id="card" class="modal" role="dialog" aria-modal="true" aria-labelledby="ct" hidden>
  <article class="paper">
    <h2 id="ct"></h2>
    <div id="msg"></div>
    <button id="close">Đóng thiệp</button>
  </article>
</section>

<section id="gate" class="gate">
  <div>
    <p>Có một vườn hoa đang chờ <span class="to"></span></p>
    <button id="enter">Chạm để bước vào vườn</button>
    <small>Bật loa để nghe nhạc nhé</small>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
